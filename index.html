<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal de Quizzes Interativos</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-light: #273549;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.16);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.16);
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 820px;
    }

    header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card-light);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    button:hover:not(:disabled) {
      border-color: var(--primary);
      background: #31435c;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    button.primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    /* Seletor Principal de Quiz */
    .quiz-selector-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 8px;
      display: block;
    }

    .quiz-tabs, .sub-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .quiz-tab {
      flex: 1 1 200px;
      text-align: left;
      padding: 12px 14px;
      background: #162033;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .quiz-tab strong {
      display: block;
      font-size: 0.95rem;
      margin-bottom: 2px;
    }

    .quiz-tab span {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .quiz-tab.active {
      background: rgba(59, 130, 246, 0.18);
      border-color: var(--primary);
    }

    .sub-filter-box {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .sub-tab {
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 999px;
    }

    .sub-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* Barra de Status e Progresso */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--card);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 18px;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.25s ease;
    }

    /* Card da Questão */
    .quiz-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }

    .badge {
      display: inline-block;
      background: rgba(59, 130, 246, 0.18);
      color: #93c5fd;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 1.12rem;
      line-height: 1.55;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
      padding: 14px 16px;
      border-radius: 12px;
      background: #162033;
      border: 1px solid var(--border);
      font-weight: 500;
      line-height: 1.45;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #1e2d47;
    }

    .option-letter {
      min-width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--card-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .option-btn.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: #ecfdf5;
    }

    .option-btn.correct .option-letter {
      background: var(--success);
      color: #064e3b;
    }

    .option-btn.wrong {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: #fef2f2;
    }

    .option-btn.wrong .option-letter {
      background: var(--danger);
      color: #fff;
    }

    .explanation {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #162033;
      border-left: 4px solid var(--primary);
      font-size: 0.94rem;
      line-height: 1.5;
      color: #e2e8f0;
      display: none;
    }

    .explanation.visible {
      display: block;
    }

    .nav-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    /* Tela Final */
    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      display: none;
    }

    .summary-score {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary);
      margin: 8px 0;
    }

    .breakdown {
      margin: 20px 0;
      display: grid;
      gap: 10px;
    }

    .breakdown-item {
      background: #162033;
      padding: 12px 14px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 0.92rem;
    }

    .review-list {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .review-item {
      background: #162033;
      padding: 14px;
      border-radius: 12px;
      border-left: 4px solid var(--border);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .review-item.ok { border-left-color: var(--success); }
    .review-item.err { border-left-color: var(--danger); }
  </style>
</head>
<body>

    <header>
      <div class="top-row">
        <h1>Central de Estudos & Quizzes</h1>
        <div class="controls">
          <button id="btn-shuffle" type="button">Embaralhar</button>
          <button id="btn-restart" type="button">Reiniciar</button>
        </div>
      </div>

      <span class="quiz-selector-label">Selecione o Quiz Manualmente:</span>
      <div class="quiz-tabs" id="quiz-tabs">

        </button>
        <button type="button" class="quiz-tab" data-quiz="todos">

        </button>
      </div>

      <div class="sub-filter-box" id="sub-filter-box">
        <span class="quiz-selector-label">Filtrar Disciplina:</span>
        <div class="sub-tabs" id="sub-tabs"></div>
      </div>
    </header>

    <div id="quiz-area">
      <div class="status-bar">
        <span id="question-counter">Questão 1 de 24</span>

      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <div class="quiz-card">
        <span class="badge" id="subject-badge">Disciplina</span>
        <div class="question-text" id="question-text"></div>
        <div class="options-list" id="options-list"></div>
        <div class="explanation" id="explanation"></div>

        <div class="nav-footer">
          <button type="button" id="btn-prev">← Anterior</button>
          <button type="button" id="btn-next" class="primary">Próxima →</button>
        </div>
      </div>
    </div>

      <div class="summary-score" id="final-score">0%</div>
      <p id="final-subtitle" style="color: var(--muted);"></p>
